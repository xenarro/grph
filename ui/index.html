<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grph</title>
    <meta name="description" content="Build a graph, see how it is stored as an adjacency matrix, adjacency list and incidence matrix, and step through graph searches.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <h1>grph</h1>
                <p>Build a graph, see how it is stored, and step through a search.</p>
            </div>
            <div class="toolbar" id="toolbar"></div>
        </header>
        <main class="workspace">
            <section class="board" aria-label="Graph drawing">
                <svg id="canvas"></svg>
                <div class="inspector" id="inspector"></div>
            </section>
            <section class="player" id="player" aria-label="Algorithm"></section>
            <aside class="structures" id="structures" aria-label="How the graph is stored"></aside>
        </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
