<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grph</title>
    <meta name="description" content="Build a graph, see how it is stored as an adjacency matrix, adjacency list and incidence matrix, and step through graph searches.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 9 L24 9 L16 24 Z' fill='none' stroke='%231f2a2e' stroke-width='2'/%3E%3Ccircle cx='8' cy='9' r='5' fill='%23fff' stroke='%231f2a2e' stroke-width='2'/%3E%3Ccircle cx='24' cy='9' r='5' fill='%231f2a2e'/%3E%3Ccircle cx='16' cy='24' r='5' fill='%23f5e15a' stroke='%231f2a2e' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <h1>grph</h1>
                <p>Build a graph, see how it is stored, and step through a search.</p>
            </div>
            <div class="toolbar" id="toolbar"></div>
        </header>
        <main class="workspace">
            <section class="board" aria-label="Graph drawing">
                <div class="paper"><canvas id="canvas"></canvas></div>
                <div class="inspector" id="inspector"></div>
            </section>
            <section class="player" id="player" aria-label="Algorithm"></section>
            <aside class="structures" id="structures" aria-label="How the graph is stored"></aside>
        </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
