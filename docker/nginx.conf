server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The policy the build also puts in a <meta> (vite.config.mts), plus frame-ancestors, which only a
    # header can set: no other site may show the page in a frame.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite puts a content hash in every file name under assets/, so these never change.
    # (A location with its own add_header drops the ones above, so nosniff is repeated.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # the visualizer is a single page without client-side routes
    location / {
        try_files $uri $uri/ =404;
    }
}
